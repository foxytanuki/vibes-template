pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{js,ts,jsx,tsx,json}"
      run: bunx --bun biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    type-check:
      run: bunx --bun tsc -b

pre-push:
  commands:
    test:
      run: bunx --bun vitest run
